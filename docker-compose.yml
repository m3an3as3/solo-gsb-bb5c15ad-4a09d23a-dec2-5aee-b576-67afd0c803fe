services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: predictions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predictions"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/predictions
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # python:3.12-slim 无 curl/wget，直接用标准库探活
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # 只读完整性巡检（一次性任务，不参与默认启动）：复用同一镜像与数据库连接，
  # 在同一 PostgreSQL 一致性只读快照内核对揭示哈希与结算计数，输出 JSON。
  # 用法：docker compose run --rm audit [--pretty]（退出码 0 无异常 / 1 有异常）
  audit:
    build: .
    profiles: ["audit"]
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/predictions
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "app.integrity_audit"]

volumes:
  pgdata:
